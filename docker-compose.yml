services:
  project-game:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: project-game
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # In-memory rooms are intentionally capped to keep the server responsive.
      MAX_ACTIVE_ROOMS: ${MAX_ACTIVE_ROOMS:-500}
      ROOM_CREATION_LIMIT_PER_MINUTE: ${ROOM_CREATION_LIMIT_PER_MINUTE:-10}
      ROOM_CREATION_GLOBAL_PER_SECOND: ${ROOM_CREATION_GLOBAL_PER_SECOND:-5}
      SOCKET_CONNECTIONS_PER_MINUTE: ${SOCKET_CONNECTIONS_PER_MINUTE:-60}
      MAX_SOCKETS_PER_IP: ${MAX_SOCKETS_PER_IP:-12}
      MAX_SOCKET_CONNECTIONS: ${MAX_SOCKET_CONNECTIONS:-2000}
      SOCKET_EVENTS_PER_10_SECONDS: ${SOCKET_EVENTS_PER_10_SECONDS:-120}
      CHAT_MESSAGES_PER_10_SECONDS: ${CHAT_MESSAGES_PER_10_SECONDS:-12}
      # Set to true only when a trusted reverse proxy passes the real client IP.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      # Public test rooms let visitors try each available game before joining a real room.
      ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-true}
      # Required to open the private completed-games dashboard.
      ADMIN_STATS_TOKEN: ${ADMIN_STATS_TOKEN:-}
      GAME_STATS_FILE: /app/data/completion-stats.json
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://game.24lumio.ru}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: "1.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Available only to containers on project-game_default, including Nginx Proxy Manager.
    expose:
      - "3000"
    volumes:
      - project-game-stats:/app/data

volumes:
  project-game-stats:
