services:
  project-game:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
    container_name: project-game
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      MAX_ACTIVE_ROOMS: ${MAX_ACTIVE_ROOMS:-2000}
      ROOM_CREATION_LIMIT_PER_MINUTE: ${ROOM_CREATION_LIMIT_PER_MINUTE:-10}
      ROOM_CREATION_GLOBAL_PER_SECOND: ${ROOM_CREATION_GLOBAL_PER_SECOND:-5}
      SOCKET_CONNECTIONS_PER_MINUTE: ${SOCKET_CONNECTIONS_PER_MINUTE:-60}
      MAX_SOCKETS_PER_IP: ${MAX_SOCKETS_PER_IP:-12}
      MAX_SOCKET_CONNECTIONS: ${MAX_SOCKET_CONNECTIONS:-2000}
      SOCKET_EVENTS_PER_10_SECONDS: ${SOCKET_EVENTS_PER_10_SECONDS:-120}
      CHAT_MESSAGES_PER_10_SECONDS: ${CHAT_MESSAGES_PER_10_SECONDS:-12}
      # Set to true only when a trusted reverse proxy passes the real client IP.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    # Available only to containers on project-game_default, including Nginx Proxy Manager.
    expose:
      - "3000"
